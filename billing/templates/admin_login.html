<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin sign in · Social Comment Studio Billing</title>
  <style>
    :root { --navy:#0f2a38; --coral:#ff6a3d; --muted:#667984; --line:#dce4e8; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; color:#17252c; background:#f5f7f8; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(380px,100%); padding:32px; background:#fff; border:1px solid var(--line); border-radius:20px; box-shadow:0 24px 70px rgba(15,42,56,.14); }
    h1 { margin:0 0 20px; color:var(--navy); font-size:22px; }
    label { display:block; margin:15px 0 7px; color:var(--navy); font-size:12px; font-weight:750; }
    input { width:100%; height:44px; padding:0 13px; color:#17252c; background:#f8fafb; border:1px solid var(--line); border-radius:10px; font:inherit; outline:none; }
    button { width:100%; height:44px; margin-top:20px; color:#fff; background:var(--navy); border:0; border-radius:10px; font:inherit; font-weight:800; cursor:pointer; }
    .message { padding:11px 13px; margin:18px 0 0; color:#98253d; background:#fff0f3; border:1px solid #f5ccd5; border-radius:10px; font-size:13px; }
  </style>
</head>
<body>
  <main>
    <h1>Billing admin</h1>
    {% if error %}<p class="message">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
