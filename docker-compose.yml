# The main instance's own services are named hindolroad-* (hindolroad is this
# instance's PAGE_KEY -- see app/config.py's default page) so its containers
# read like every tenant's: social-comment-bot-hindolroad-dashboard-1 beside
# social-comment-bot-gudiakateni-dashboard-1, rather than the bare
# social-comment-bot-dashboard-1 that the project name alone used to produce.
#
# `image:` is pinned on all three services because the image names must NOT
# follow the service names here. Every tenant override generated by
# billing/cli.py's _render_tenant_compose references these images by name
# (`image: social-comment-bot-dashboard` and siblings) rather than rebuilding
# its own copy. Compose otherwise derives the tag as <project>-<service>, so
# the rename alone would have retagged them social-comment-bot-hindolroad-*
# and left every tenant service unable to start ("image not found"). Pinning
# decouples the two: service/container names describe *whose* containers these
# are, image names stay the shared build artifacts all tenants point at.
services:
  hindolroad-dashboard:
    build: .
    image: social-comment-bot-dashboard
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "9001"
      REPLY_EXAMPLES_DIR: /app/reply_examples
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-9001}:9001"
    volumes:
      - ./data:/app/data
      - ./reply_examples:/app/reply_examples:ro
    # Lets the container (appuser, uid 1000) write to ./data files that the
    # hourly host-side cron (scripts/reply_comments.sh, running as whichever
    # OS Login user owns this VM) also writes to directly, outside Docker.
    # Without this, any host-side write can leave ./data owned by the host
    # user's uid, silently locking the container's webhook handler out of
    # its own database until someone notices and re-chowns it by hand (hit
    # twice in production -- see git history). The actual GID lives in .env
    # (not committed -- see .env.example) since it's specific to this VM's
    # OS Login-assigned identity, not something to hardcode for every
    # deployment of this repo.
    group_add:
      - "${HOST_DATA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

  hindolroad-video-stats:
    build: .
    image: social-comment-bot-video-stats
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      REPLY_EXAMPLES_DIR: /app/reply_examples
    command: ["nice", "-n", "15", "python", "-m", "app.video_stats"]
    healthcheck:
      # The worker intentionally has no HTTP listener. Container liveness is
      # sufficient because Compose stops it when the Python child exits.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - ./data:/app/data
      - ./reply_examples:/app/reply_examples:ro
    # Stats are eventually consistent. Reserve most of the small VM's CPU
    # for Gunicorn and the webhook worker during a refresh cycle.
    cpus: "0.35"
    mem_limit: 256m
    group_add:
      - "${HOST_DATA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

  hindolroad-youtube-comments:
    build: .
    image: social-comment-bot-youtube-comments
    restart: unless-stopped
    init: true
    env_file:
      - .env
      - config/polling.env
    environment:
      REPLY_EXAMPLES_DIR: /app/reply_examples
    command: ["nice", "-n", "10", "python", "-m", "app.youtube_worker"]
    healthcheck:
      # This is a scheduler process with no HTTP listener. Compose restarts it
      # if the Python process exits unexpectedly.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - ./data:/app/data
      - ./reply_examples:/app/reply_examples:ro
    group_add:
      - "${HOST_DATA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
