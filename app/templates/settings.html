<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f2a38">
  <title>Settings · Content My Trip</title>
  <style>
    :root { --navy:#0f2a38; --navy-soft:#173b4c; --coral:#ff6a3d; --muted:#667984; --line:#dce4e8; --ink:#17252c; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#f5f7f8; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .topbar { height:74px; padding:0 26px; display:flex; align-items:center; justify-content:space-between; background:#fff; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:10px; color:var(--navy); font-weight:850; text-decoration:none; }
    .brand img { width:120px; height:40px; object-fit:contain; }
    .back { color:var(--navy); font-size:13px; font-weight:750; text-decoration:none; }
    .page { max-width:640px; margin:0 auto; padding:40px 24px 80px; }
    .eyebrow { display:block; margin-bottom:8px; color:var(--coral); font-size:11px; font-weight:850; letter-spacing:.13em; text-transform:uppercase; }
    h1 { margin:0 0 10px; color:var(--navy); font-size:30px; letter-spacing:-.03em; }
    .summary { margin:0 0 28px; color:var(--muted); font-size:14px; line-height:1.6; }
    .links { display:grid; gap:12px; }
    .link-card { display:flex; align-items:center; justify-content:space-between; padding:18px 20px; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 5px 18px rgba(15,42,56,.035); text-decoration:none; transition:.15s ease; }
    .link-card:hover { border-color:#b9c9d1; box-shadow:0 10px 24px rgba(15,42,56,.08); transform:translateY(-1px); }
    .link-card-title { display:block; color:var(--navy); font-size:15px; font-weight:800; }
    .link-card-url { display:block; margin-top:4px; color:var(--muted); font-size:12px; }
    .link-card-arrow { color:var(--coral); font-size:18px; }
    .section-label { display:block; margin:28px 0 12px; color:var(--muted); font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .section-label:first-of-type { margin-top:0; }
    @media (max-width:620px) { .topbar{padding:0 16px}.page{padding:28px 16px 60px}h1{font-size:25px} }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><img src="{{ url_for('static', filename='images/content-my-trip-logo.svg') }}" alt="Content My Trip"></a>
    <a class="back" href="/">&larr; Back to dashboard</a>
  </header>
  <main class="page">
    <span class="eyebrow">Social Comment Studio</span>
    <h1>Settings</h1>
    <p class="summary">Account settings, plus the public policy pages used for Meta App Review.</p>

    <span class="section-label">Account</span>
    <div class="links">
      <a class="link-card" href="/profile/password">
        <span><span class="link-card-title">Reset password</span><span class="link-card-url">/profile/password</span></span>
        <span class="link-card-arrow" aria-hidden="true">&#8594;</span>
      </a>
    </div>

    <span class="section-label">Policies</span>
    <div class="links">
      <a class="link-card" href="/privacy" target="_blank" rel="noopener">
        <span><span class="link-card-title">Privacy Policy</span><span class="link-card-url">/privacy</span></span>
        <span class="link-card-arrow" aria-hidden="true">&#8599;</span>
      </a>
      <a class="link-card" href="/terms" target="_blank" rel="noopener">
        <span><span class="link-card-title">Terms of Service</span><span class="link-card-url">/terms</span></span>
        <span class="link-card-arrow" aria-hidden="true">&#8599;</span>
      </a>
      <a class="link-card" href="/datadeletion" target="_blank" rel="noopener">
        <span><span class="link-card-title">Data Deletion Instructions</span><span class="link-card-url">/datadeletion</span></span>
        <span class="link-card-arrow" aria-hidden="true">&#8599;</span>
      </a>
    </div>
  </main>
</body>
</html>
