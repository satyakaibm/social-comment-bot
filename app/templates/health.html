<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071a14">
  <title>Gateway healthy</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #06130f;
      --panel: rgba(12, 39, 30, 0.78);
      --line: rgba(134, 239, 172, 0.2);
      --text: #ecfdf5;
      --muted: #a7c9b9;
      --green: #4ade80;
      --glow: rgba(74, 222, 128, 0.24);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 18%, rgba(22, 163, 74, 0.18), transparent 32%),
        radial-gradient(circle at 86% 82%, rgba(13, 148, 136, 0.16), transparent 30%),
        var(--bg);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.24;
      background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }
    main {
      position: relative;
      width: min(560px, 100%);
      padding: 52px 44px 38px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 30px 80px rgba(0, 0, 0, .38), inset 0 1px rgba(255, 255, 255, .05);
      backdrop-filter: blur(18px);
    }
    .pulse {
      width: 86px;
      height: 86px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #052e16;
      background: var(--green);
      box-shadow: 0 0 0 12px rgba(74, 222, 128, .08), 0 0 52px var(--glow);
      animation: breathe 2.8s ease-in-out infinite;
    }
    .pulse svg { width: 42px; height: 42px; }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--green);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(30px, 7vw, 46px); letter-spacing: -.04em; line-height: 1.05; }
    .message { margin: 18px auto 30px; max-width: 390px; color: var(--muted); font-size: 16px; line-height: 1.65; }
    .details {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      color: #d1fae5;
      background: rgba(16, 185, 129, .08);
      border: 1px solid rgba(74, 222, 128, .14);
      font-size: 13px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px var(--green); }
    a { color: var(--muted); text-decoration: none; }
    a:hover { color: var(--text); }
    .dashboard-link { display: inline-block; margin-top: 25px; font-size: 14px; }
    @keyframes breathe { 50% { transform: scale(1.04); box-shadow: 0 0 0 17px rgba(74, 222, 128, .04), 0 0 65px var(--glow); } }
    @media (max-width: 480px) { main { padding: 42px 24px 30px; border-radius: 22px; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="pulse" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="m5 12 4 4L19 6"/>
      </svg>
    </div>
    <p class="eyebrow">System status</p>
    <h1>Gateway is healthy</h1>
    <p class="message">The comment review service is online and ready to receive Meta webhook events.</p>
    <div class="details">
      <span class="badge"><span class="dot"></span>Operational</span>
      <span class="badge">HTTP 200</span>
      <span class="badge">Webhook ready</span>
    </div>
    <a class="dashboard-link" href="/">Open comment review dashboard &rarr;</a>
  </main>
</body>
</html>
